<title>aicoyy — Booting</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* ── 9Router coming-soon: committed dark terminal ─────────────────
     Single visual world (a console screen). Dark-committed by design,
     every color painted explicitly so it holds on any host ground. */
  :root {
    --bg:        #070b0e;   /* near-black, faint cyan bias */
    --bg-glow:   #0b1418;   /* radial center lift          */
    --panel:     #0c1418;   /* terminal body               */
    --panel-bar: #10191f;   /* title bar                   */
    --edge:      #1a2a30;   /* hairline borders            */
    --edge-soft: #14212700;
    --ink:       #c9d6d3;   /* primary readout             */
    --ink-dim:   #63767a;   /* muted / comments            */
    --ink-fade:  #3b4a4e;   /* deepest muted               */
    --signal:    #35e6bf;   /* routing cyan — the accent   */
    --signal-dim:#1f8f7c;
    --amber:     #f0b64a;   /* in-progress state           */
    --ok:        #35e6bf;
    --shadow:    rgba(0,0,0,.55);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code",
            "Fira Code", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background:
      radial-gradient(120% 90% at 50% 32%, var(--bg-glow) 0%, var(--bg) 62%);
    color: var(--ink);
    font-family: var(--mono);
    font-size: clamp(13px, 1.15vw + 9px, 16px);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 4vw, 48px);
    overflow: hidden;
    position: relative;
  }

  /* ambient data-flow canvas, behind everything */
  #flow {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 0; opacity: .5;
  }
  /* fine scanline overlay */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: repeating-linear-gradient(
      to bottom, rgba(255,255,255,.014) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay;
  }

  .term {
    position: relative; z-index: 2;
    width: min(680px, 100%);
    background: linear-gradient(180deg, var(--panel) 0%, #0a1013 100%);
    border: 1px solid var(--edge);
    border-radius: 12px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.03) inset,
      0 24px 60px -20px var(--shadow),
      0 0 0 1px rgba(53,230,191,.04);
    overflow: hidden;
  }

  /* title bar */
  .bar {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 15px;
    background: var(--panel-bar);
    border-bottom: 1px solid var(--edge);
  }
  .dots { display: flex; gap: 7px; }
  .dots i {
    width: 11px; height: 11px; border-radius: 50%;
    background: #263238; display: block;
  }
  .dots i:nth-child(1) { background: #34474d; }
  .title {
    font-size: .8em; letter-spacing: .08em; color: var(--ink-dim);
    text-transform: uppercase;
  }
  .title b { color: var(--ink); font-weight: 600; }
  .badge {
    margin-left: auto; font-size: .72em; letter-spacing: .1em;
    color: var(--signal); border: 1px solid var(--signal-dim);
    padding: 2px 8px; border-radius: 999px;
    background: rgba(53,230,191,.06);
  }

  /* screen */
  .screen { padding: 26px clamp(16px, 3.5vw, 30px) 30px; }

  .log { margin: 0; min-height: 168px; }
  .line {
    display: flex; gap: 10px; white-space: pre-wrap;
    opacity: 0; transform: translateY(3px);
  }
  .line.in { opacity: 1; transform: none; transition: opacity .28s ease, transform .28s ease; }
  .tag { flex: none; width: 4.2em; color: var(--ink-fade); }
  .tag.ok  { color: var(--signal); }
  .tag.run { color: var(--amber); }
  .msg .k { color: var(--ink); }
  .msg .v { color: var(--ink-dim); }
  .msg .hl { color: var(--signal); }
  .prompt { color: var(--signal); }
  .cmd    { color: var(--ink); }

  /* the announcement */
  .drop {
    margin-top: 26px; padding-top: 24px;
    border-top: 1px dashed var(--edge);
    opacity: 0; transform: translateY(8px);
  }
  .drop.in { opacity: 1; transform: none; transition: opacity .5s ease, transform .5s ease; }
  .eyebrow {
    font-size: .74em; letter-spacing: .32em; text-transform: uppercase;
    color: var(--ink-dim); margin: 0 0 12px;
  }
  .headline {
    margin: 0; font-size: clamp(24px, 4.6vw, 40px);
    font-weight: 600; letter-spacing: .01em; line-height: 1.08;
    color: var(--ink); text-wrap: balance;
  }
  .headline .soon {
    color: var(--signal);
    text-shadow: 0 0 26px rgba(53,230,191,.35);
  }
  .cursor {
    display: inline-block; width: .58em; height: 1.02em;
    margin-left: .06em; vertical-align: -.14em;
    background: var(--signal); box-shadow: 0 0 12px rgba(53,230,191,.6);
    animation: blink 1.05s steps(1) infinite;
  }
  @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }

  /* ── charging battery ──────────────────────────── */
  .charge {
    display: flex; align-items: center; gap: 16px;
    margin-top: 24px;
    opacity: 0; transform: translateY(6px);
  }
  .charge.in { opacity: 1; transform: none; transition: opacity .5s ease .15s, transform .5s ease .15s; }

  .batt { display: flex; align-items: center; }
  .batt-body {
    position: relative;
    width: 116px; height: 46px;
    border: 2px solid var(--edge);
    border-radius: 7px;
    padding: 4px;
    background: rgba(255,255,255,.015);
    overflow: hidden;
  }
  .batt-cap {
    width: 5px; height: 18px;
    margin-left: 3px;
    background: var(--edge);
    border-radius: 0 3px 3px 0;
  }
  .batt-fill {
    position: absolute; inset: 4px; right: auto;
    width: 0%;                       /* driven by JS */
    border-radius: 3px;
    background: linear-gradient(90deg, var(--signal-dim), var(--signal));
    box-shadow: 0 0 18px rgba(53,230,191,.45);
    transition: width .28s ease;
    overflow: hidden;
  }
  /* current sweeping through the cell */
  .batt-flow {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
    transform: translateX(-100%);
    animation: flow 1.4s linear infinite;
  }
  @keyframes flow { to { transform: translateX(220%); } }

  .bolt {
    position: absolute; top: 50%; left: 50%;
    width: 20px; height: 20px; transform: translate(-50%,-50%);
    fill: #061014; opacity: .9;
    filter: drop-shadow(0 0 3px rgba(0,0,0,.4));
  }
  .charge-read { display: flex; flex-direction: column; line-height: 1.25; }
  .charge-read b {
    font-size: 1.35em; font-weight: 600; color: var(--ink);
    font-variant-numeric: tabular-nums; letter-spacing: .02em;
  }
  .charge-read span {
    font-size: .74em; letter-spacing: .18em; text-transform: uppercase;
    color: var(--signal);
  }

  .meta {
    display: flex; flex-wrap: wrap; gap: 10px 26px;
    margin-top: 22px; font-size: .82em; color: var(--ink-dim);
  }
  .meta span { display: inline-flex; align-items: center; gap: 8px; }
  .meta .pip {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--signal); box-shadow: 0 0 8px rgba(53,230,191,.7);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .meta a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--edge); }
  .meta a:hover { color: var(--signal); border-color: var(--signal-dim); }
  .meta a:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .line, .drop { opacity: 1 !important; transform: none !important; }
    .charge { opacity: 1 !important; transform: none !important; }
    .batt-flow { animation: none; display: none; }
    .cursor { animation: none; opacity: 1; }
    .meta .pip { animation: none; opacity: 1; }
    #flow { display: none; }
  }
</style>

<canvas id="flow" aria-hidden="true"></canvas>

<main class="term" role="status" aria-live="polite" aria-label="aicoyy is launching soon">
  <div class="bar">
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="title"><b>aicoyy</b>&nbsp;— gateway</div>
    <div class="badge">v0.0 · pre-release</div>
  </div>

  <div class="screen">
    <div class="log" id="log"></div>

    <div class="drop" id="drop">
      <p class="eyebrow">status</p>
      <h1 class="headline">Will be arrived <span class="soon">very soon</span><span class="cursor" id="cur"></span></h1>

      <div class="charge" id="charge">
        <div class="batt">
          <div class="batt-body">
            <div class="batt-fill" id="battFill">
              <span class="batt-flow"></span>
            </div>
            <svg class="bolt" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
          </div>
          <div class="batt-cap"></div>
        </div>
        <div class="charge-read">
          <b id="battPct">0%</b>
          <span id="battState">charging</span>
        </div>
      </div>

      <div class="meta">
        <span><i class="pip"></i> one endpoint · 40+ providers</span>
        <span>aicoyy.dev</span>
      </div>
    </div>
  </div>
</main>

<script>
(() => {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const log = document.getElementById("log");

  // boot log — real 9Router surface area
  const lines = [
    { p: true,  cmd: "aicoyy --init" },
    { tag: "ok",  k: "gateway core", v: "loaded" },
    { tag: "ok",  k: "provider registry", v: "", hl: "40+ upstreams" },
    { tag: "ok",  k: "endpoint", v: "openai-compatible", hl: "/v1/*" },
    { tag: "ok",  k: "translator", v: "claude ⇄ openai ⇄ gemini" },
    { tag: "ok",  k: "fallback engine", v: "multi-account · model-combo" },
    { tag: "run", k: "dashboard", v: "provisioning" },
  ];

  const el = (cls, txt) => { const s = document.createElement("span"); s.className = cls; if (txt != null) s.textContent = txt; return s; };

  function render(item) {
    const row = document.createElement("div");
    row.className = "line";
    if (item.p) {
      row.append(el("prompt", "$"), el("cmd", item.cmd));
    } else {
      const tag = el("tag " + item.tag, "[" + item.tag + "]");
      const msg = el("msg");
      msg.append(el("k", item.k));
      if (item.v) msg.append(document.createTextNode(" "), el("v", item.v));
      if (item.hl) msg.append(document.createTextNode(" "), el("hl", item.hl));
      row.append(tag, msg);
    }
    log.appendChild(row);
    return row;
  }

  /* ── battery charge readout ── */
  function startCharge(instant) {
    const fill  = document.getElementById("battFill");
    const pctEl  = document.getElementById("battPct");
    const stateEl = document.getElementById("battState");
    const target = 30;               // holds at 30% — "very soon", still early
    stateEl.textContent = "charging";
    if (instant) {
      fill.style.width = target + "%";
      pctEl.textContent = target + "%";
      return;
    }
    let pct = 0;
    const tick = () => {
      // ease-out: fast start, gentle finish
      pct += Math.max(0.35, (target - pct) * 0.06);
      if (pct >= target) pct = target;
      fill.style.width = pct + "%";
      pctEl.textContent = Math.round(pct) + "%";
      if (pct < target) {
        setTimeout(tick, 42);
      } else {
        // loop: hold briefly at 30%, drain, then charge again
        setTimeout(() => {
          fill.style.width = "0%";
          pct = 0;
          pctEl.textContent = "0%";
          setTimeout(tick, 360);
        }, 900);
      }
    };
    tick();
  }

  if (reduce) {
    lines.forEach(l => render(l).classList.add("in"));
    document.getElementById("drop").classList.add("in");
    document.getElementById("charge").classList.add("in");
    startCharge(true);
  } else {
    let i = 0;
    const step = () => {
      if (i >= lines.length) {
        setTimeout(() => {
          document.getElementById("drop").classList.add("in");
          document.getElementById("charge").classList.add("in");
          setTimeout(() => startCharge(false), 260);
        }, 320);
        return;
      }
      const row = render(lines[i]);
      requestAnimationFrame(() => row.classList.add("in"));
      i++;
      setTimeout(step, i === 1 ? 520 : 300 + Math.random() * 170);
    };
    setTimeout(step, 380);
  }

  /* ── ambient routing flow: packets drifting along faint lanes ── */
  if (!reduce) {
    const c = document.getElementById("flow");
    const ctx = c.getContext("2d");
    let w, h, dpr, lanes = [], packets = [];

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      w = c.width = innerWidth * dpr;
      h = c.height = innerHeight * dpr;
      c.style.width = innerWidth + "px";
      c.style.height = innerHeight + "px";
      const n = Math.max(5, Math.round(innerHeight / 90));
      lanes = Array.from({ length: n }, (_, k) => ({
        y: (k + .5) / n * h,
        amp: (18 + Math.random() * 34) * dpr,
        len: 900 + Math.random() * 700,
        ph: Math.random() * Math.PI * 2,
      }));
      packets = Array.from({ length: n * 3 }, () => spawn());
    }
    function spawn() {
      const lane = lanes[(Math.random() * lanes.length) | 0] || { y: h / 2, amp: 20, ph: 0 };
      return { lane, x: Math.random() * w, sp: (0.4 + Math.random() * 0.9) * dpr, r: (1 + Math.random() * 1.6) * dpr };
    }
    function yAt(lane, x) { return lane.y + Math.sin(x / lane.len + lane.ph) * lane.amp; }

    function frame() {
      ctx.clearRect(0, 0, w, h);
      // lanes
      ctx.lineWidth = dpr;
      lanes.forEach(lane => {
        ctx.beginPath();
        for (let x = 0; x <= w; x += 14 * dpr) {
          const y = yAt(lane, x);
          x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.strokeStyle = "rgba(53,230,191,0.045)";
        ctx.stroke();
      });
      // packets
      packets.forEach(p => {
        p.x += p.sp;
        if (p.x > w + 20) { p.x = -20; p.lane = lanes[(Math.random() * lanes.length) | 0]; }
        const y = yAt(p.lane, p.x);
        const g = ctx.createRadialGradient(p.x, y, 0, p.x, y, p.r * 5);
        g.addColorStop(0, "rgba(53,230,191,0.85)");
        g.addColorStop(1, "rgba(53,230,191,0)");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, y, p.r * 5, 0, Math.PI * 2); ctx.fill();
      });
      requestAnimationFrame(frame);
    }
    resize();
    addEventListener("resize", resize);
    frame();
  }
})();
</script>
